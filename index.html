<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--<meta name="theme-color" content="#111827">-->
  <meta name="theme-color" content="#080D1C">
<title>NAVAA</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  
<style>
  
/* ====================================================
      NAVAA EXCHANGE — PREMIUM DESIGN SYSTEM
                   RESPONSIVE
====================================================== */
  
  :root {
    color-scheme: dark;
    --bg: #080D1C;
    --surface: #101A32;
    --surface2: #172443;
    --surface3: #223354;
    --line: #263657;
    --text: #F4F7FF;
    --muted: #9AA9C7;
    --accent: #18D6C5;
    --accent-hover: #32E6D5;
    --accent-text: #071522;
    --green: #0ecb81;
    --red: #f6465d;
    --header-bg: #080D1C;
    --radius: 8px;
    --header-height: 68px;
    --transition: 0.25s ease;
  }
  
/* =====================================
           LIGHT THEME
====================================== */
  
  [data-theme="light"] {
    color-scheme: light;
    --bg: #F5F8FC;
    --surface: #FFFFFF;
    --surface2: #EDF3F8;
    --surface3: #E3ECF3;
    --line: #DCE5EF;
    --text: #14213A;
    --muted: #65758B;
    --accent: #0FBFB2;
    --accent-hover: #0AA99E;
    --accent-text: #061A24;
    --green: #0ecb81;
    --red: #f6465d;
    --header-bg: #FFFFFF;
  }

/* =================================
             RESET
================================== */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    transition: background 0.25s ease, color 0.25s ease;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 0 56px;
  }

/* ==========================================
            NAVIGATION HEADER
========================================== */

.top {
  width: 100%;
  min-height: var(--header-height);

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 24px;
  padding: 0 28px;

  background: var(--header-bg);

  border-bottom: 1px solid var(--line);

  position: sticky;
  top: 0;
  z-index: 1000;

  transition:
    background 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}

/* ==========================================
   NAVAA — PREMIUM ANIMATED BRAND VFX
========================================== */

  .brand {
    position: relative;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 50px;
    isolation: isolate;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

/*--------ROTATING ENERGY RING----------*/

  .brand::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 45deg,
      rgba(24,214,197,0.18) 90deg,
      #18D6C5 145deg,
      #8FFFF4 175deg,
      rgba(24,214,197,0.35) 205deg,
      transparent 260deg,
      transparent 360deg
    );

    -webkit-mask:
      radial-gradient(
        farthest-side,
        transparent calc(100% - 2px),
        #000 calc(100% - 1.5px)
      );

    mask:
      radial-gradient(
        farthest-side,
        transparent calc(100% - 2px),
        #000 calc(100% - 1.5px)
      );

    animation: navaaOrbit 4s linear infinite;

    z-index: 0;
  }

/*-----------SOFT NEON PULSE-------------*/

  .brand::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: rgba(24,214,197,0.13);
    filter: blur(10px);
    animation: navaaPulse 3s ease-in-out infinite;
    z-index: -1;
  }

  /*-------OFFICIAL TOKEN IMAGE---------*/
  
  .brand-logo {
    position: relative;
    z-index: 1;
    width: 40px;
    height: 40px;
    display: block;
    object-fit: contain;
    object-position: center;
    flex-shrink: 0;
    border-radius: 50%;
    animation: navaaFloat 4s ease-in-out infinite;
    transition:
      transform 0.35s cubic-bezier(.2,.8,.2,1),
      filter 0.35s ease;
  }

/*----------CONTINUOUS ROTATION------------*/

  @keyframes navaaOrbit {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

/*-----------BREATHING LIGHT------------*/

  @keyframes navaaPulse {
    0%, 100% {
      opacity: 0.35;
      transform: scale(0.88);
    }
    50% {
      opacity: 0.85;
      transform: scale(1.12);
    }
  }

/*------- GENTLE FLOATING LOGO -------*/

  @keyframes navaaFloat {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-2px);
    }
  }

/*---------- DESKTOP HOVER ----------*/

  .brand:hover .brand-logo {
    transform: scale(1.09);
    filter:
      drop-shadow(0 0 5px rgba(24,214,197,0.65))
      drop-shadow(0 0 12px rgba(24,214,197,0.35));
  }

  /*--------- TOUCH FEEDBACK ---------*/

  .brand:active .brand-logo {
    transform: scale(0.91);
    filter:
      drop-shadow(0 0 9px rgba(24,214,197,0.7));
  }

/* =================================================
    CENTER NAVIGATION : Earn & Exchange [ Tab ]
================================================== */

  .main-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex: 1 1 auto;
    min-width: 0;
  }

  .nav-tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: var(--header-height);
    padding: 0 20px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease;
}

  .nav-tab:hover {
    color: var(--text);
    background: var(--surface2);
  }

  .nav-tab.active {
    color: var(--accent);
  }
  
  .nav-tab.active::after {
    content: "";
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: var(--accent);
    animation: navIndicator 0.25s ease;
  }

  @keyframes navIndicator {
    from {
      transform: scaleX(0.3);
      opacity: 0;
    }

    to {
      transform: scaleX(1);
      opacity: 1;
    }
  }

/* ==========================================
         HEADER ACTIONS
========================================== */

.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  flex: 0 0 auto;
}

.row {
  display: flex;
  align-items: center;
}

/* ==========================================
   CONNECT WALLET BUTTON
========================================== */

.btn {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--accent-text);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 18px rgba(24,214,197,0.22);
}

.btn:active {
  transform: scale(0.96);
}

/* ==========================================
        THEME SWITCH BUTTON
========================================== */

.theme-btn {
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: 19px;
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    transform 0.25s ease;
}

.theme-btn:hover {
  background: var(--surface2);
  border-color: var(--accent);
  transform: rotate(15deg);
}

.theme-btn:active {
  transform: scale(0.92);
}

/* ==========================================
         ACCESSIBILITY
========================================== */

button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ==========================================
            RESPONSIVE : TABLET
========================================== */

  @media (max-width: 850px) {

    .top {
      gap: 14px;
      padding: 0 18px;
    }

    .brand {
      width: 46px;
      height: 46px;
      flex-basis: 46px;
    }
  
    .brand-logo {
      width: 40px;
      height: 40px;
    }

  .main-nav {
    gap: 2px;
  }

  .nav-tab {
    padding: 0 14px;
    font-size: 13px;
  }

  .top-actions {
    gap: 8px;
  }

}

/* ==========================================
         RESPONSIVE : MOBILE
========================================== */

@media (max-width: 600px) {

  :root {
    --header-height: 58px;
  }

  .top {
    min-height: var(--header-height);
    gap: 4px;
    padding: 0 8px;
  }

  .brand {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
  }

  .main-nav {
    flex: 1 1 auto;
    min-width: 0;
  }

  .top-actions {
    flex: 0 0 auto;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
  }

  .main-nav {
    gap: 0;
    justify-content: center;
  }

  .nav-tab {
    min-height: var(--header-height);
    padding: 0 10px;
    font-size: 12px;
  }

  .nav-tab.active::after {
    left: 10px;
    right: 10px;
    height: 2px;
  }

  .top-actions {
    gap: 6px;
  }

  .theme-btn {
    width: 34px;
    height: 34px;
    font-size: 17px;
  }

  .btn {
    min-height: 34px;
    padding: 0 10px;
    font-size: 12px;
  }
}

/* ==========================================
       RESPONSIVE : SMALL MOBILE
========================================== */

@media (max-width: 380px) {

  .top {
    gap: 4px;
    padding: 0 8px;
  }

    .brand {
      width: 40px;
      height: 40px;
      flex-basis: 40px;
    }

  .brand-logo {
    width: 32px;
    height: 32px;
  }

  .nav-tab {
    padding: 0 7px;
    font-size: 11px;
  }

  .nav-tab.active::after {
    left: 7px;
    right: 7px;
  }

  .top-actions {
    gap: 5px;
  }

  .theme-btn {
    width: 31px;
    height: 31px;
    font-size: 16px;
  }

  .btn {
    min-height: 32px;
    padding: 0 7px;
    font-size: 10px;
  }
}

/* ==========================================
         REDUCED MOTION ACCESSIBILITY
========================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
/* ===================================================
           END : HEADER DESIGN 
  ===================================================*/

  /* =========================================
              NAVAA Wallet Balance
  =============================================*/
.balance-card {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:22px 24px;
  margin:18px 0 22px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(120deg,var(--surface),var(--surface2));

}
.balance-info { min-width:0; }
.balance-label {

  letter-spacing:1.2px;

}
.balance-value {
  margin-top:5px;
  color:var(--text);

.balance-symbol {
  color:var(--accent);

}

.add-fund-btn:hover { filter:brightness(1.1); }
.fund-sheet {

  z-index:9999;
  display:none;
  align-items:flex-end;
  justify-content:center;

}
.fund-sheet.show { display:flex; }
.fund-sheet-box {

  border:1px solid var(--line);
  border-radius:22px 22px 0 0;

}
.fund-option {
  width:100%;
  margin-top:10px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:12px;

  color:var(--text);
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
@media(max-width:480px) {
  .balance-card { padding:16px 13px; gap:8px; }
  .balance-value { font-size:23px; }
  .add-fund-btn { padding:11px 13px; font-size:12px; }
}
  

</style>
</head>
  <body>
    <main>

      <!--//////////////////////////////////////////////////////
                HEADER Navbar html Design : Part - 1
      ///////////////////////////////////////////////////////-->
    <header class="top">     
      <div class="brand">
        <img
          src="https://navaa-world.github.io/Navaa-official2/navaa-logo.png?v=2"
          class="brand-logo"
          alt="NAVAA Token Logo"
          width="40"
          height="40">
      </div>
 
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-tab active" id="pageEarnTab" type="button">Earn</button>
        <button class="nav-tab" id="pageExchangeTab" type="button">Exchange</button>
      </nav>
      
      <div class="top-actions row">
        <button 
          class="theme-btn" 
          id="themeToggle" 
          type="button"
          aria-label="Switch theme"
          title="Switch theme">
          ☀
        </button>
        <button class="btn" id="connectBtn">
          Connect wallet
        </button>
      </div>  
    </header>
    <!--==================== END Header Navbar Part - 1 ================--->

      <!--////////////////////////////////////////////////
                    NAVAA Wallet Balance 
      ////////////////////////////////////////////////-->
<section class="balance-card" id="navaaBalanceCard">

  <div class="balance-info">
    <div class="balance-label">My NAVAA Balance</div>

    <div class="balance-value">
      <span id="navaaBalanceAmount">—</span>
      <span class="balance-symbol">NAVAA</span>
    </div>

    <div class="balance-status" id="navaaBalanceStatus">
      Connect wallet to view your balance
    </div>
  </div>

  <button class="add-fund-btn" id="addFundBtn" type="button">
    + Add Fund
  </button>

</section>

<!-- Add Fund Popup -->
<div class="fund-sheet" id="fundSheet">
  <div class="fund-sheet-box">
    <div class="row">
      <h2>Add Funds</h2>
      <button class="btn secondary" id="closeFundSheet" type="button">✕</button>
    </div>

    <button class="fund-option" id="fundP2P" type="button">
      P2P <span class="muted">— Coming Soon</span>
    </button>

    <button class="fund-option" id="fundExchange" type="button">
      Exchange <span class="muted">— NAVAA Exchange</span>
    </button>

    <div class="balance-status" id="fundMessage"></div>
  </div>
</div>
      
      
    </main>
    <script>
      /*=========================================================
                          JAVASCRIPT START
      ==========================================================*/
      
      /*========================================
                  NAVAA THEME SYSTEM
      ========================================*/

      const themeToggle = document.getElementById("themeToggle");
      function setTheme(theme) {
        document.documentElement.setAttribute(
          "data-theme",
          theme
        );

        localStorage.setItem("navaa-theme", theme);

        if (themeToggle) {
          themeToggle.textContent =
            theme === "dark" ? "☀" : "☾";
        }
      }
      
      /**************************************
                  Load saved theme
      **************************************/

      const savedTheme =
        localStorage.getItem("navaa-theme") || "dark";
      setTheme(savedTheme);

    /**************************************
                  Toggle theme
    **************************************/

      themeToggle.addEventListener("click", () => {

        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        setTheme(
          currentTheme === "dark" ? "light" : "dark"
        );
      });
      
    </script>
<!--==================================================
          JAVASCRIPT : Wallet Balance 
    ===============================================--->
    <script>
      (() => {
        'use strict';
        const TOKEN_ADDRESS =
          '0x82dba663278ADF0c398c1795a31760c7a76CA932';

        const POLYGON_CHAIN_ID = 137n;
        const TOKEN_ABI = [
          'function balanceOf(address) view returns (uint256)',
          'function decimals() view returns (uint8)',
          'function symbol() view returns (string)'
        ];

        const $ = id => document.getElementById(id);
        const connectBtn = $('connectBtn');
        const balanceAmount = $('navaaBalanceAmount');
        const balanceStatus = $('navaaBalanceStatus');

        let walletAddress = null;
        let walletProvider = null;

        function shortAddress(address) {
          return address.slice(0, 6) + '...' + address.slice(-4);
        }
        
        function showBalance(value) {
          balanceAmount.textContent = value;
        }
        
        function showStatus(message) {
          balanceStatus.textContent = message;
        }
        
        async function readNavaaBalance() {
          if (!walletAddress || !window.ethereum) return;
          try {
            walletProvider =
              new ethers.BrowserProvider(window.ethereum);
            const network = await walletProvider.getNetwork();

            if (network.chainId !== POLYGON_CHAIN_ID) {
              showBalance('—');
              showStatus('Please switch to Polygon Mainnet');
              return;
            }

            const token = new ethers.Contract(
              TOKEN_ADDRESS,
              TOKEN_ABI,
              walletProvider
            );

            const [rawBalance, decimals, symbol] =
              await Promise.all([
                token.balanceOf(walletAddress),
                token.decimals(),
                token.symbol()
              ]);

            const formatted = Number(
              ethers.formatUnits(rawBalance, decimals)
            ).toLocaleString('en-US', {
              maximumFractionDigits: 4
            });
     
            showBalance(formatted);
            showStatus(
              shortAddress(walletAddress) +
              ' · ' + symbol + ' balance on Polygon'
            );
          } 
          
          catch (error) {
            console.error('NAVAA balance error:', error);
            showBalance('—');
            showStatus('Unable to load NAVAA balance. Please retry.');
          }
        }

  async function connectWallet() {
    try {
      if (!window.ethereum) {
        showStatus('Open this website inside MetaMask, Trust Wallet or SafePal DApp browser.');
        return;
      }

      connectBtn.disabled = true;
      connectBtn.textContent = 'Connecting...';

      let accounts = await window.ethereum.request({
        method: 'eth_requestAccounts'
      });

      if (!accounts || !accounts.length) {
        throw new Error('No wallet account found.');
      }

      let chain = await window.ethereum.request({
        method: 'eth_chainId'
      });

      if (BigInt(chain) !== POLYGON_CHAIN_ID) {
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x89' }]
          });
        } catch (error) {
          if (error.code === 4902) {
            await window.ethereum.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: '0x89',
                chainName: 'Polygon Mainnet',
                nativeCurrency: {
                  name: 'POL',
                  symbol: 'POL',
                  decimals: 18
                },
                rpcUrls: ['https://polygon.drpc.org'],
                blockExplorerUrls: ['https://polygonscan.com']
              }]
            });
          } else {
            throw error;
          }
        }
      }

      accounts = await window.ethereum.request({
        method: 'eth_accounts'
      });

      walletAddress = accounts[0];

      connectBtn.textContent = shortAddress(walletAddress);

      await readNavaaBalance();

    } catch (error) {
      console.error('Wallet connection error:', error);
      showStatus(error.message || 'Wallet connection failed.');
      connectBtn.textContent = 'Connect wallet';

    } finally {
      connectBtn.disabled = false;
    }
  }

  connectBtn.addEventListener('click', connectWallet);

  if (window.ethereum && window.ethereum.on) {

    window.ethereum.on('accountsChanged', accounts => {
      walletAddress = accounts.length ? accounts[0] : null;

      if (!walletAddress) {
        connectBtn.textContent = 'Connect wallet';
        showBalance('—');
        showStatus('Connect wallet to view your balance');
        return;
      }

      connectBtn.textContent = shortAddress(walletAddress);
      readNavaaBalance();
    });

    window.ethereum.on('chainChanged', () => {
      readNavaaBalance();
    });
  }

  // Restore an already-authorized wallet without a new permission prompt
  async function restoreWallet() {
    if (!window.ethereum) return;

    try {
      const accounts = await window.ethereum.request({
        method: 'eth_accounts'
      });

      if (accounts.length) {
        walletAddress = accounts[0];
        connectBtn.textContent = shortAddress(walletAddress);
        await readNavaaBalance();
      }
    } catch (error) {
      console.error(error);
    }
  }

  restoreWallet();

  // Add Fund popup
  $('addFundBtn').addEventListener('click', () => {
    $('fundSheet').classList.add('show');
  });

  $('closeFundSheet').addEventListener('click', () => {
    $('fundSheet').classList.remove('show');
  });

  $('fundSheet').addEventListener('click', event => {
    if (event.target === $('fundSheet')) {
      $('fundSheet').classList.remove('show');
    }
  });

  $('fundP2P').addEventListener('click', () => {
    $('fundMessage').textContent = 'P2P is coming soon.';
  });

  $('fundExchange').addEventListener('click', () => {
    $('fundSheet').classList.remove('show');

    const exchangeTab = $('pageExchangeTab');

    if (exchangeTab) exchangeTab.click();
  });

})();
</script>
    
  </body>
