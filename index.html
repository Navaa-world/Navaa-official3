<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#080D1C">
<title>NAVAA</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  
<style>
  
/* ==========================================
   NAVAA EXCHANGE — PREMIUM DESIGN SYSTEM
   BINANCE INSPIRED | RESPONSIVE
========================================== */

:root {
  color-scheme: dark;

  --bg: #080D1C;
  --surface: #101A32;
  --surface2: #172443;
  --surface3: #223354;

  --line: #263657;

  --text: #F4F7FF;
  --muted: #9AA9C7;

  --accent: #18D6C5;
  --accent-hover: #32E6D5;
  --accent-text: #071522;

  --green: #0ecb81;
  --red: #f6465d;

  --header-bg: #080D1C;

  --radius: 8px;
  --header-height: 68px;

  --transition: 0.25s ease;
}
  
/* ==========================================
   LIGHT THEME
========================================== */

/*[data-theme="light"] {
  color-scheme: light;

  --bg: #ffffff;
  --surface: #ffffff;
  --surface2: #f5f5f5;
  --surface3: #eeeeee;

  --line: #eaecef;

  --text: #1e2329;
  --muted: #707a8a;

  --accent: #f0b90b;
  --accent-hover: #dba600;
  --accent-text: #181a20;

  --green: #0ecb81;
  --red: #f6465d;

  --header-bg: #ffffff;
}*/

  
[data-theme="light"] {
  color-scheme: light;

  --bg: #F5F8FC;
  --surface: #FFFFFF;
  --surface2: #EDF3F8;
  --surface3: #E3ECF3;

  --line: #DCE5EF;

  --text: #14213A;
  --muted: #65758B;

  --accent: #0FBFB2;
  --accent-hover: #0AA99E;
  --accent-text: #061A24;

  --green: #0ecb81;
  --red: #f6465d;

  --header-bg: #FFFFFF;
}


/* ==========================================
   RESET
========================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  background: var(--bg);
  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  font-size: 14px;
  line-height: 1.5;

  transition:
    background 0.25s ease,
    color 0.25s ease;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

main {
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  margin: 0 auto;
  padding: 0 0 56px;
}

/* ==========================================
   NAVIGATION HEADER
========================================== */

.top {
  width: 100%;
  min-height: var(--header-height);

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 24px;
  padding: 0 28px;

  background: var(--header-bg);

  border-bottom: 1px solid var(--line);

  position: sticky;
  top: 0;
  z-index: 1000;

  transition:
    background 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}

/* ==========================================
   NAVAA BRAND LOGO
========================================== */

.brand {
  display: flex;
  align-items: center;
  justify-content: flex-start;

  flex: 0 0 auto;
  min-width: 0;
}

.brand-logo {
  width: 42px;
  height: 42px;

  display: block;

  object-fit: contain;
  object-position: center;

  flex-shrink: 0;

  border-radius: 50%;

  cursor: pointer;

  transition:
    transform 0.3s ease,
    filter 0.3s ease;
}

/*.brand-logo:hover {
  transform: scale(1.07);
  filter: drop-shadow(0 0 7px rgba(240,185,11,0.25));
}
*/
  .brand-logo:hover {
  transform: scale(1.07);
  filter: drop-shadow(0 0 7px rgba(240,185,11,0.25));
}

  
.brand-logo:active {
  transform: scale(0.96);
}

/* ==========================================
   CENTER NAVIGATION
========================================== */

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 8px;

  flex: 1 1 auto;
  min-width: 0;
}

.nav-tab {
  position: relative;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: var(--header-height);

  padding: 0 20px;

  border: none;
  border-radius: 0;

  background: transparent;

  color: var(--muted);

  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;

  transition:
    color 0.2s ease,
    background 0.2s ease;
}

.nav-tab:hover {
  color: var(--text);
  background: var(--surface2);
}

.nav-tab.active {
  color: var(--accent);
}

.nav-tab.active::after {
  content: "";

  position: absolute;

  left: 18px;
  right: 18px;
  bottom: 0;

  height: 3px;

  border-radius: 3px 3px 0 0;

  background: var(--accent);

  animation: navIndicator 0.25s ease;
}

@keyframes navIndicator {
  from {
    transform: scaleX(0.3);
    opacity: 0;
  }

  to {
    transform: scaleX(1);
    opacity: 1;
  }
}

/* ==========================================
   HEADER ACTIONS
========================================== */

.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 12px;

  flex: 0 0 auto;
}

.row {
  display: flex;
  align-items: center;
}

/* ==========================================
   CONNECT WALLET BUTTON
========================================== */

.btn {
  min-height: 38px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 0 18px;

  border: 1px solid transparent;
  border-radius: var(--radius);

  background: var(--accent);
  color: var(--accent-text);

  font-size: 14px;
  font-weight: 700;

  white-space: nowrap;

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.btn:hover {
  background: var(--accent-hover);

  transform: translateY(-1px);

 /* box-shadow:
    0 4px 14px rgba(240,185,11,0.18);*/

  box-shadow:
    0 4px 18px rgba(24,214,197,0.22);
}

.btn:active {
  transform: scale(0.96);
}

/* ==========================================
   THEME SWITCH BUTTON
========================================== */

.theme-btn {
  width: 38px;
  height: 38px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  border: 1px solid var(--line);
  border-radius: var(--radius);

  background: var(--surface);
  color: var(--text);

  font-size: 19px;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    transform 0.25s ease;
}

.theme-btn:hover {
  background: var(--surface2);
  border-color: var(--accent);

  transform: rotate(15deg);
}

.theme-btn:active {
  transform: scale(0.92);
}

/* ==========================================
   ACCESSIBILITY
========================================== */

button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ==========================================
   TABLET RESPONSIVE
========================================== */

@media (max-width: 850px) {

  .top {
    gap: 14px;
    padding: 0 18px;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
  }

  .main-nav {
    gap: 2px;
  }

  .nav-tab {
    padding: 0 14px;
    font-size: 13px;
  }

  .top-actions {
    gap: 8px;
  }

}

/* ==========================================
   MOBILE RESPONSIVE
========================================== */

@media (max-width: 600px) {

  :root {
    --header-height: 58px;
  }

  .top {
    min-height: var(--header-height);

    gap: 6px;

    padding: 0 12px;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
  }

  .main-nav {
    gap: 0;
    justify-content: center;
  }

  .nav-tab {
    min-height: var(--header-height);

    padding: 0 10px;

    font-size: 12px;
  }

  .nav-tab.active::after {
    left: 10px;
    right: 10px;
    height: 2px;
  }

  .top-actions {
    gap: 6px;
  }

  .theme-btn {
    width: 34px;
    height: 34px;
    font-size: 17px;
  }

  .btn {
    min-height: 34px;
    padding: 0 10px;
    font-size: 12px;
  }

}

/* ==========================================
   SMALL MOBILE
========================================== */

@media (max-width: 380px) {

  .top {
    gap: 4px;
    padding: 0 8px;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
  }

  .nav-tab {
    padding: 0 7px;
    font-size: 11px;
  }

  .nav-tab.active::after {
    left: 7px;
    right: 7px;
  }

  .top-actions {
    gap: 5px;
  }

  .theme-btn {
    width: 31px;
    height: 31px;
    font-size: 16px;
  }

  .btn {
    min-height: 32px;
    padding: 0 7px;
    font-size: 10px;
  }

}

/* ==========================================
   REDUCED MOTION ACCESSIBILITY
========================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

}


</style>
</head>
  <body>
    <main>

      <!--//////////////////////////////////////////////////////
                HEADER Navbar html Design : Part - 1
      ///////////////////////////////////////////////////////-->
    <header class="top">     
      <div class="brand">
        <img 
          src="https://navaa-world.github.io/Navaa-official2/navaa-logo.png?v=2"
          class="brand-logo"
          alt="NAVAA Token Logo">
      </div>
      
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-tab active" id="pageEarnTab" type="button">Earn</button>
        <button class="nav-tab" id="pageExchangeTab" type="button">Exchange</button>
      </nav>
      
      <div class="top-actions row">
        <button 
          class="theme-btn" 
          id="themeToggle" 
          type="button"
          aria-label="Switch theme"
          title="Switch theme">
          ☀
        </button>
        <button class="btn" id="connectBtn">
          Connect wallet
        </button>
      </div>  
    </header>
    <!--==================== END Header Navbar Part - 1 ================--->
      
      
    </main>
    <script>
      /*=========================================================
                          JAVASCRIPT START
      ==========================================================*/
      
      /*========================================
                  NAVAA THEME SYSTEM
      ========================================*/

      const themeToggle = document.getElementById("themeToggle");
      function setTheme(theme) {
        document.documentElement.setAttribute(
          "data-theme",
          theme
        );

        localStorage.setItem("navaa-theme", theme);

        if (themeToggle) {
          themeToggle.textContent =
            theme === "dark" ? "☀" : "☾";
        }
      }
      
      /**************************************
                  Load saved theme
      **************************************/

      const savedTheme =
        localStorage.getItem("navaa-theme") || "dark";
      setTheme(savedTheme);

    /**************************************
                  Toggle theme
    **************************************/

      themeToggle.addEventListener("click", () => {

        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        setTheme(
          currentTheme === "dark" ? "light" : "dark"
        );
      });





      
    </script>
  </body>
</html>
